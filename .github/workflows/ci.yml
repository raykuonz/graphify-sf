name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimal permissions by default; individual jobs may expand as needed
permissions:
  contents: read

jobs:
  test:
    name: Test / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.6"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies (from lock file)
        run: uv sync --extra dev --frozen

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

  # Installs every optional extra so the real-SDK contract tests
  # (tests/test_llm_sdk_contract.py) and the real Leiden engine tests run
  # instead of being skipped. Catches breaking major releases of the
  # unbounded optional dependencies (anthropic, openai, boto3, ...).
  test-all-extras:
    name: Test all extras / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.6"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install all extras (from lock file)
        run: uv sync --all-extras --frozen

      - name: Run tests (skips fail the job)
        env:
          GRAPHIFY_SF_FAIL_ON_SKIP: "1"
        run: uv run pytest tests/ -v --tb=short -rs

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.6"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install lint dependencies
        run: uv sync --extra dev --frozen

      - name: Run ruff (linter)
        run: uv run ruff check graphify_sf/ tests/

      - name: Run ruff (formatter check)
        run: uv run ruff format --check graphify_sf/ tests/

      - name: Check skills/graphify-sf/SKILL.md is in sync with graphify_sf/_bundled_skill.md
        run: |
          if ! diff -q skills/graphify-sf/SKILL.md graphify_sf/_bundled_skill.md > /dev/null 2>&1; then
            echo "ERROR: skills/graphify-sf/SKILL.md is out of sync with graphify_sf/_bundled_skill.md"
            echo "Run: cp graphify_sf/_bundled_skill.md skills/graphify-sf/SKILL.md"
            diff skills/graphify-sf/SKILL.md graphify_sf/_bundled_skill.md
            exit 1
          fi
          echo "SKILL.md files are in sync ✓"

  security:
    name: Dependency Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.6"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --group binary --frozen

      # Keep pip itself patched in the audit environment. pip is provisioned by
      # uv (not a declared project dependency), so a freshly-published advisory
      # against the bundled pip would otherwise fail the audit on every PR even
      # when the project's own dependencies are clean (e.g. PYSEC-2026-196).
      - name: Upgrade pip in the venv
        run: uv pip install --upgrade pip

      - name: Run pip-audit
        run: uv run pip-audit --skip-editable

  npm-wrapper:
    name: npm wrapper tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Run npm wrapper tests
        working-directory: npm
        run: node --test

  # Builds the Linux release binary exactly as release-binaries.yml does
  # (manylinux_2_28, glibc 2.28 floor), fails if anything bundled needs a newer
  # glibc, and runs it on AlmaLinux 8/9, Ubuntu 22.04 and Debian 12. Nothing is
  # uploaded; this keeps a glibc regression (sf-cockpit #38) out of releases.
  linux-binary:
    name: Linux binary / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.6"

      - name: Export hash-locked binary requirements
        shell: bash
        run: bash .github/scripts/export-binary-requirements.sh

      - name: Build in manylinux_2_28 + glibc gate
        run: bash .github/scripts/build-linux-binary.sh

      - name: Smoke-test on supported Linux distros
        run: bash .github/scripts/smoke-linux-binary.sh dist/graphify-sf

  # The macOS / Windows release legs run the same shared PyInstaller script;
  # build with it on every PR so a break (e.g. CRLF on Windows checkouts)
  # can't first surface at release time.
  desktop-binary:
    name: Binary / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.6"

      - name: Export hash-locked binary requirements
        shell: bash
        run: bash .github/scripts/export-binary-requirements.sh

      - name: Install package + PyInstaller (hash-locked)
        shell: bash
        run: bash .github/scripts/install-binary-deps.sh python

      - name: Build with the shared PyInstaller script
        shell: bash
        run: bash .github/scripts/pyinstaller-build.sh python

      - name: Run the binary on a fixture project
        shell: bash
        run: |
          bin=dist/graphify-sf
          [ -f "${bin}.exe" ] && bin="${bin}.exe"
          "$bin" --version
          "$bin" tests/fixtures/simple_project --out "$RUNNER_TEMP/out" --no-viz > /dev/null
          test -s "$RUNNER_TEMP/out/graph.json"
          echo "graph.json OK"
