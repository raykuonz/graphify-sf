name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches pyproject.toml
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # The wheel takes its version from pyproject.toml; the binaries and npm packages from the tag.
          pyproject_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)"
          [ "v${pyproject_version}" = "$TAG" ] || {
            echo "release tag $TAG != v${pyproject_version:-<none>} from pyproject.toml; refusing to publish." >&2
            exit 1
          }

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.6"
          enable-cache: false   # never cache in a release job

      - name: Build sdist and wheel
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi  # optional: gate behind a GitHub environment with reviewers
    permissions:
      contents: read
      id-token: write  # OIDC trusted publishing; the build job, which runs build-backend code, has none

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
