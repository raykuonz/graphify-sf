name: Release Binaries + npm

# Triggered by the same release event as publish.yml (PyPI).
# Jobs, in order:
#   resolve        validates the tag (no code, no checkout)
#   build-binaries one read-only leg per platform; builds PyInstaller binaries from the
#                  hash-locked environment and uploads each as a workflow artifact
#   attach-assets  the only job that writes to the release: attaches the binaries, then
#                  records their checksums from the published bytes. Runs no PyPI/npm package
#                  code, only pinned first-party actions and gh
#   publish-npm    publishes the npm packages; has the OIDC token but cannot write the release
#
# It also supports manual re-runs against an existing tag via workflow_dispatch, e.g. to
# finish a partial publish. A re-run attaches only missing release binaries and publishes only
# npm versions not yet on the registry; it never replaces bytes that were already released
# (so a bad published asset or package needs a new patch version, not a re-run). Dispatch
# checks out the tag's tree, so it needs a tag that contains the hash-locked binary build
# (.github/scripts/export-binary-requirements.sh, v0.5.0 or later); older tags fail the
# preflight check.
#
# dry_run=true (workflow_dispatch only) builds from the dispatching ref instead of a tag and
# exercises every job - artifacts, the five-file checks, checksums, npm packing - without
# touching the release or the registry: `npm publish --dry-run`, no gh release writes.
#
# npm auth: Trusted Publishing (OIDC). Each of the 6 packages has a trusted
# publisher for raykuonz/graphify-sf + release-binaries.yml with "npm publish"
# allowed; no npm token is used. npm also attaches provenance automatically.
# The PyPI publish remains in publish.yml and is not affected by this file.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (v0.5.0 or later) to finish building/publishing (e.g. v0.5.0). Not used when dry_run is true."
        required: false
        type: string
      dry_run:
        description: "Build from this ref and run every job without writing to the release or the npm registry"
        required: false
        default: false
        type: boolean

# Least privilege per job. id-token (npm Trusted Publishing) goes ONLY to
# publish-npm: the build legs run third-party PyPI code, and npm's trusted
# publisher trusts this workflow file, so any job able to mint an OIDC token
# could publish.
permissions:
  contents: read

# A release event and a manual dispatch for the same tag must not interleave.
# Dry runs have no tag and never contend.
concurrency:
  group: release-binaries-${{ github.event.inputs.tag || github.event.release.tag_name || github.run_id }}
  cancel-in-progress: false

jobs:
  # Everything downstream reads the tag, version, checkout ref and mode from here; they come only
  # from the release event / dispatch inputs and are validated before any later step interpolates them.
  resolve:
    name: Resolve release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      version: ${{ steps.r.outputs.version }}
      ref: ${{ steps.r.outputs.ref }}
      dry_run: ${{ steps.r.outputs.dry_run }}
    steps:
      - name: Resolve release tag
        id: r
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "version=0.0.0-dryrun" >> "$GITHUB_OUTPUT"
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "DRY RUN from $GITHUB_SHA: nothing is written to the release or the npm registry"
            exit 0
          fi
          TAG="${INPUT_TAG:-$RELEASE_TAG}"
          # Later steps interpolate the tag/version into scripts; accept only a
          # plain semver tag so that is always safe.
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "refusing non-semver tag: $TAG"; exit 1; }
          echo "dry_run=false" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "ref=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=${TAG} version=${TAG#v}"

  build-binaries:
    name: Build binary (${{ matrix.target-os }}-${{ matrix.target-arch }})
    needs: resolve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    # Read-only: this job runs third-party build code. The binary leaves as a workflow
    # artifact; attach-assets (no third-party code) is what writes to the release.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux legs build inside manylinux_2_28 (glibc 2.28 floor); the
          # runner only hosts docker. See .github/scripts/build-linux-binary.sh.
          - runner: ubuntu-24.04
            target-os: linux
            target-arch: x64
            asset-name: graphify-sf-linux-x64

          - runner: ubuntu-24.04-arm
            target-os: linux
            target-arch: arm64
            asset-name: graphify-sf-linux-arm64

          - runner: macos-15-intel
            target-os: darwin
            target-arch: x64
            asset-name: graphify-sf-darwin-x64

          - runner: macos-14
            target-os: darwin
            target-arch: arm64
            asset-name: graphify-sf-darwin-arm64

          - runner: windows-latest
            target-os: win32
            target-arch: x64
            asset-name: graphify-sf-win32-x64.exe

    steps:
      # Check out the exact tagged commit so the build matches the release
      # (the dispatching ref in a dry run).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false

      - name: Inject version into graphify_sf/_version.py
        shell: bash
        run: |
          VERSION="${{ needs.resolve.outputs.version }}"
          echo "__version__ = \"${VERSION}\"" > graphify_sf/_version.py
          echo "Injected version: ${VERSION}"

      - name: Set up Python 3.12
        if: matrix.target-os != 'linux'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Preflight - tag has the hash-locked binary build
        shell: bash
        run: |
          [ -f .github/scripts/export-binary-requirements.sh ] || {
            echo "ref ${{ needs.resolve.outputs.ref }} predates the hash-locked binary build (needs v0.5.0 or later)." >&2
            echo "Older releases cannot be re-run from this workflow." >&2
            exit 1
          }

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.6"
          enable-cache: false   # never cache in a release job

      - name: Export hash-locked binary requirements
        shell: bash
        run: bash .github/scripts/export-binary-requirements.sh

      - name: Install package + PyInstaller (hash-locked)
        if: matrix.target-os != 'linux'
        shell: bash
        run: bash .github/scripts/install-binary-deps.sh python

      - name: Build with PyInstaller (macOS / Windows)
        if: matrix.target-os != 'linux'
        shell: bash
        run: bash .github/scripts/pyinstaller-build.sh python

      # Builds inside manylinux_2_28 and fails if any bundled library needs a
      # glibc newer than 2.28.
      - name: Build with PyInstaller (Linux, manylinux_2_28)
        if: matrix.target-os == 'linux'
        shell: bash
        run: bash .github/scripts/build-linux-binary.sh

      - name: Smoke-test on supported Linux distros
        if: matrix.target-os == 'linux'
        shell: bash
        run: bash .github/scripts/smoke-linux-binary.sh dist/graphify-sf

      - name: Rename artifact to release asset name
        shell: bash
        run: |
          SRC="dist/graphify-sf"
          if [ "${{ matrix.target-os }}" = "win32" ]; then
            SRC="dist/graphify-sf.exe"
          fi
          cp "${SRC}" "${{ matrix.asset-name }}"

      # One artifact per platform, named exactly like the release asset; attach-assets
      # allowlists these five names. A missing file fails the leg.
      - name: Upload binary as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset-name }}
          path: ${{ matrix.asset-name }}
          if-no-files-found: error
          retention-days: 7

  attach-assets:
    name: Attach binaries + record checksums
    needs: [resolve, build-binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The only job that writes to the release. It checks nothing out and runs no PyPI/npm
    # package code - only pinned first-party actions and gh - and has no id-token.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.resolve.outputs.tag }}
      DRY_RUN: ${{ needs.resolve.outputs.dry_run }}
      # The only assets this workflow publishes; also the artifact names from build-binaries.
      EXPECTED: graphify-sf-linux-x64 graphify-sf-linux-arm64 graphify-sf-darwin-x64 graphify-sf-darwin-arm64 graphify-sf-win32-x64.exe

    steps:
      - name: Download built binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: graphify-sf-*
          merge-multiple: true
          path: built

      - name: Verify exactly the five expected binaries
        shell: bash
        run: |
          set -euo pipefail
          for a in $EXPECTED; do
            [ -s "built/$a" ] || { echo "missing or empty artifact: $a" >&2; exit 1; }
          done
          extra="$(ls built | grep -vxF -f <(printf '%s\n' $EXPECTED) || true)"
          [ -z "$extra" ] || { echo "unexpected files in artifacts: $extra" >&2; exit 1; }
          ls -l built

      # Never replace an existing asset: the published npm checksums.json pins
      # these exact bytes, and PyInstaller builds are not reproducible, so a
      # re-run must reuse them. Deleting an asset to force a rebuild is only
      # safe before graphify-sf@<version> is on npm; after that the npm
      # checksums would no longer match and the fallback download is refused.
      - name: Attach missing binaries to the release
        if: needs.resolve.outputs.dry_run != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Capture first: a gh error fails the step instead of reading as
          # "absent", and grep -q can't SIGPIPE gh under pipefail.
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')"
          for a in $EXPECTED; do
            if grep -qxF "$a" <<<"$assets"; then
              echo "$a already on release $TAG; keeping the published bytes"
            else
              gh release upload "$TAG" "built/$a" --repo "$GITHUB_REPOSITORY"
            fi
          done

      # Checksums describe what is actually published, which on a re-run can differ from the
      # bytes just built: read them back from the release.
      - name: Download the published binaries
        if: needs.resolve.outputs.dry_run != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p published
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "graphify-sf-*" --dir published --clobber
          for a in $EXPECTED; do
            [ -s "published/$a" ] || { echo "release $TAG lacks $a" >&2; exit 1; }
          done

      # Record each binary's sha256 for the GitHub-download fallback in
      # npm/lib/download.js. checksums.json ships inside the main npm tarball
      # (integrity-pinned by lockfiles), so a release asset swapped later under
      # this tag is rejected instead of executed. Copies go on the release for
      # manual verification. Fails unless all five binaries are present.
      - name: Record binary checksums
        shell: bash
        run: |
          set -euo pipefail
          dir=published
          [ "$DRY_RUN" = "true" ] && dir=built
          mkdir -p out
          node -e '
            const fs = require("fs"), crypto = require("crypto"), path = require("path");
            const dir = process.argv[1];
            const expected = process.env.EXPECTED.split(" ");
            const table = {};
            for (const asset of expected) {
              const file = path.join(dir, asset);
              if (!fs.existsSync(file)) { console.error("missing release binary:", asset); process.exit(1); }
              table[asset] = crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex");
            }
            fs.writeFileSync("out/checksums.json", JSON.stringify(table, null, 2) + "\n");
            fs.writeFileSync("out/SHA256SUMS", Object.entries(table).map(([a, h]) => `${h}  ${a}`).join("\n") + "\n");
          ' "$dir"
          cat out/SHA256SUMS

      - name: Publish checksums on the release
        if: needs.resolve.outputs.dry_run != 'true'
        shell: bash
        run: |
          gh release upload "$TAG" out/checksums.json out/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber

      - name: Hand checksums.json to publish-npm
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums
          path: out/checksums.json
          if-no-files-found: error
          retention-days: 7

  publish-npm:
    name: Publish to npm (platform subpackages + main)
    needs: [resolve, attach-assets]
    runs-on: ubuntu-latest
    environment: npm
    # No release write access: checksums are recorded and uploaded by attach-assets.
    permissions:
      contents: read
      id-token: write   # npm Trusted Publishing (OIDC) + provenance
    env:
      # `npm publish --dry-run` in a dry run; empty otherwise.
      NPM_DRY: ${{ needs.resolve.outputs.dry_run == 'true' && '--dry-run' || '' }}

    steps:
      # The tag, not the dispatch ref: on workflow_dispatch github.ref is main,
      # which would pack main's npm/ under the tag's version (and provenance).
      # A dry run checks out the dispatching ref instead.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false

      # No registry-url: it would write an _authToken=${NODE_AUTH_TOKEN} line
      # into .npmrc, and trusted publishing uses OIDC instead of a token.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false   # never cache in a release job

      # Exact npm, installed unconditionally: the bundled one is whatever the latest Node 24 ships.
      # Trusted Publishing needs >= 11.5.1.
      - name: Install pinned npm
        shell: bash
        run: |
          npm install -g npm@11.21.1
          npm --version

      # The binaries that attach-assets put on the GitHub Release (a dry run uses the freshly
      # built artifacts). These are the exact bytes shipped inside the platform subpackages, so
      # the npm channel and the GitHub-download fallback serve byte-identical binaries.
      - name: Download release binaries
        if: needs.resolve.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p release-bin
          cd release-bin
          gh release download "${{ needs.resolve.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "graphify-sf-*" \
            --clobber
          ls -l

      - name: Download built binaries (dry run)
        if: needs.resolve.outputs.dry_run == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: graphify-sf-*
          merge-multiple: true
          path: release-bin

      # checksums.json ships inside the main npm tarball; attach-assets computed it from the
      # published bytes and uploaded the same file to the release.
      - name: Download checksums.json
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checksums
          path: npm

      # Scaffold npm/platforms/<plat>-<arch>/ for every target whose binary is
      # present. --strict fails the job if any of the five is missing, so a
      # partial matrix never ships an incomplete set.
      - name: Scaffold platform subpackages
        run: |
          node npm/scripts/build-subpackages.js \
            --version "${{ needs.resolve.outputs.version }}" \
            --bin-dir release-bin \
            --out-dir npm/platforms \
            --strict

      # Subpackages MUST publish before the main package: the main package pins
      # exact subpackage versions in optionalDependencies. Versions already on
      # the registry are skipped (npm never allows republishing one), so a
      # re-run after a partial publish picks up where it stopped.
      - name: Publish platform subpackages
        shell: bash
        run: |
          set -e
          for dir in npm/platforms/*/; do
            name="$(node -p 'require(require("path").resolve(process.argv[1])).name || ""' "${dir}package.json")"
            ver="$(node -p 'require(require("path").resolve(process.argv[1])).version || ""' "${dir}package.json")"
            [ -n "${name}" ] && [ -n "${ver}" ] || { echo "bad package.json in ${dir}"; exit 1; }
            spec="${name}@${ver}"
            # Exact-version match only: anything else (absent, registry error)
            # falls through to npm publish, which fails loudly if it must.
            if [ "$(npm view "${spec}" version 2>/dev/null || true)" = "${ver}" ]; then
              echo "${spec} is already published; skipping"
              continue
            fi
            echo "Publishing ${spec} from ${dir} ..."
            npm publish "${dir}" --access public ${NPM_DRY}
          done

      # Stamp the release version into the main package (its version and its
      # optionalDependencies pins) directly via node — idempotent, unlike
      # `npm version` which errors with "Version not changed" when the in-repo
      # version already equals VERSION (it does, bumped in the release PR).
      - name: Stamp version into main package + optionalDependencies
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const p = "npm/package.json";
            const v = process.env.VERSION;
            const pkg = JSON.parse(fs.readFileSync(p, "utf8"));
            pkg.version = v;
            for (const k of Object.keys(pkg.optionalDependencies || {})) {
              pkg.optionalDependencies[k] = v;
            }
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + "\n");
            console.log("main package stamped to", v);
          '

      - name: Publish main package
        shell: bash
        run: |
          set -e
          ver="${{ needs.resolve.outputs.version }}"
          [ -n "${ver}" ] || { echo "empty release version"; exit 1; }
          # The tarball must carry checksums.json and no stray binary in bin/.
          npm pack ./npm --dry-run --json > "$RUNNER_TEMP/pack.json"
          node -e '
            const files = require(process.argv[1])[0].files.map((f) => f.path);
            const bad = [];
            for (const need of ["checksums.json", "bin/graphify-sf.js"]) if (!files.includes(need)) bad.push("missing " + need);
            for (const f of files) if (f.startsWith("bin/") && f !== "bin/graphify-sf.js") bad.push("unexpected " + f);
            if (bad.length) { console.error("npm tarball check failed:", bad.join(", ")); process.exit(1); }
            console.log("tarball files:", files.join(" "));
          ' "$RUNNER_TEMP/pack.json"
          spec="graphify-sf@${ver}"
          if [ "$(npm view "${spec}" version 2>/dev/null || true)" = "${ver}" ]; then
            echo "${spec} is already published; skipping"
          else
            npm publish ./npm --access public ${NPM_DRY}
          fi
